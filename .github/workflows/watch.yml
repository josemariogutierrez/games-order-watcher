name: Watch game store

on:
  schedule:
    # GitHub cron is UTC. Bogota is UTC-5 year round (no DST).
    # 15:00-23:59 UTC = 10:00-18:59 Bogota
    - cron: "*/5 15-23 * * *"
    # 00:00-02:59 UTC = 19:00-21:59 Bogota (previous day)
    - cron: "*/5 0-2 * * *"
  workflow_dispatch:
    inputs:
      prime:
        description: "Record current posts without sending alerts"
        type: boolean
        default: false
      test:
        description: "Send one test notification (changes nothing)"
        type: boolean
        default: false

# watcher.py trims the edges to exactly 10:30-21:30 Bogota.

concurrency:
  group: watch-game-store
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Poll the page
        id: watch
        continue-on-error: true
        env:
          # Telegram takes priority when both are set; ntfy stays as a fallback.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PYTHONUNBUFFERED: "1"  # keep stdout/stderr interleaved in the CI log
          # Repo variable. Set to 1 to alert on every new post; unset or 0 to
          # use keywords.txt. Toggle it in Settings without touching the code.
          ALERT_ALL: ${{ vars.ALERT_ALL }}
        run: |
          python3 watcher.py \
            ${{ inputs.test && '--test' || '' }} \
            ${{ inputs.prime && '--prime --force' || '' }}

      - name: Persist state
        run: |
          # Only commit when the seen-posts map or the failure counter actually
          # changed. last_success updates every run, and committing that alone
          # would add ~140 commits a day for no reason.
          real_change=$(git diff -U0 -- state/seen.json \
            | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' \
            | grep -v '"last_success"' || true)
          if [ -z "$real_change" ]; then
            echo "No meaningful state change."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          git commit -m "state: update seen posts [skip ci]"
          # Another run may have pushed while we were working.
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            echo "push attempt $i failed, retrying"
            sleep 5
          done
          exit 1

      - name: Surface poll failure
        if: steps.watch.outcome == 'failure'
        run: |
          echo "::error::watcher.py failed - see the 'Poll the page' step"
          exit 1
