name: Watch game store

on:
  schedule:
    # GitHub delays scheduled starts heavily - measured 137-229 min late on the
    # day's first trigger, which left the window uncovered and made one post
    # arrive 151 min late. Mitigations: odd minutes (:07/:27/:47 are far less
    # congested than :00 and :30), and many start attempts so a dropped or
    # delayed one is covered by the next. Concurrency keeps at most one job
    # running plus one pending, and a job that starts outside the window exits
    # in seconds, so the extra triggers are cheap.
    # 14:00-02:59 UTC spans the 9:30-21:30 Bogota window (UTC-5).
    - cron: "7,27,47 14-23 * * *"
    - cron: "7,27,47 0-2 * * *"
  workflow_dispatch:
    inputs:
      prime:
        description: "Record current posts without sending alerts"
        type: boolean
        default: false
      test:
        description: "Send one test notification (changes nothing)"
        type: boolean
        default: false
      loop:
        description: "Run the polling loop (uncheck for a single poll)"
        type: boolean
        default: true

# A queued run starts when the current one ends, which extends coverage rather
# than piling up: a job launched after the window closes exits within seconds.
concurrency:
  group: watch-game-store
  cancel-in-progress: false

permissions:
  contents: write

env:
  POLL_SECONDS: 300
  MAX_MINUTES: 300        # stay well under the 6h job ceiling
  WINDOW_START: "09:30"   # Bogota
  WINDOW_END: "21:30"     # Bogota

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Single poll
        if: inputs.test || inputs.prime || inputs.loop == false
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALERT_ALL: ${{ vars.ALERT_ALL }}
          PYTHONUNBUFFERED: "1"
        run: |
          python3 watcher.py \
            ${{ inputs.test && '--test' || '' }} \
            ${{ inputs.prime && '--prime --force' || '' }}

      - name: Polling loop
        if: ${{ !(inputs.test || inputs.prime || inputs.loop == false) }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALERT_ALL: ${{ vars.ALERT_ALL }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -uo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          start_window=$(TZ=America/Bogota date -d "today ${WINDOW_START}" +%s)
          end_window=$(TZ=America/Bogota date -d "today ${WINDOW_END}" +%s)
          if [ "$(date +%s)" -lt "$start_window" ]; then
            echo "Before the window opens; nothing to do."; exit 0
          fi
          end_max=$(( $(date +%s) + MAX_MINUTES * 60 ))
          echo "Looping every ${POLL_SECONDS}s until $(date -d @${end_window} -u +%H:%M) UTC"

          i=0
          while :; do
            now=$(date +%s)
            [ "$now" -ge "$end_window" ] && { echo "Window closed."; break; }
            [ "$now" -ge "$end_max" ]    && { echo "Max job duration reached."; break; }

            i=$((i + 1))
            echo "--- poll #${i} $(TZ=America/Bogota date +%H:%M:%S) Bogota"

            # The Mac is the primary watcher and pushes state as it goes. Pull
            # first so we don't re-alert on a post it already reported.
            git pull -q --rebase --autostash origin main 2>/dev/null \
              || echo "  (pull failed, using local state)"
            python3 watcher.py || echo "  (poll reported a problem, continuing)"

            # Commit only when the seen-posts map changed. Failure and blind
            # counters are per-machine bookkeeping - committing them produced a
            # commit every 5 min through every blind spell.
            changed=$(git diff -U0 -- state/seen.json \
              | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' \
              | grep -vE '"last_success"|"consecutive_failures"|"blind_since"|"blind_alerted"' || true)
            if [ -n "$changed" ]; then
              git add state/seen.json
              git commit -q -m "state: update seen posts [skip ci]"
              git pull -q --rebase --autostash origin main && git push -q origin main \
                && echo "  state pushed" || echo "  state push failed, will retry next poll"
            fi

            remaining=$(( end_window - $(date +%s) ))
            [ "$remaining" -le 0 ] && break
            sleep $(( remaining < POLL_SECONDS ? remaining : POLL_SECONDS ))
          done
          echo "Loop finished after ${i} poll(s)."
